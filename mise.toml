[env]
MISE_USE_VERSIONS_HOST = "0"

[tools]
actionlint = "latest"
hk = "latest"
lua = "5.5.1"
lua-language-server = "latest"
pkl = "latest"
stylua = "latest"

[tasks.lint]
description = "Lint Lua scripts and GitHub Actions using hk"
run = "hk check --all"

[tasks.lint-fix]
description = "Fix linting issues"
run = "hk fix"

[tasks.test]
description = "Run the hooks through mise in throwaway directories and check the result"
run = "sh test/run.sh"
